```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <style>
        table {
            width: 80%;
            margin: 50px auto;
            padding: 10px;
            font-size: 25px;
            color: black;
            border: 2px solid black;
            border-collapse: collapse;
        }

        th, td {
            border: 2px solid black;
            padding: 15px;
            text-align: center;
        }

        table thead {
            background-color: rgb(154, 91, 91);
        }

        img {
            width: 100px;
            height: 100px;
        }
    </style>
</head>

<body>

    <table>
        <thead>
            <tr>
                <th>Sr. No</th>
                <th>Temperature</th>
                <th>Weather</th>
                <th>Image</th>
            </tr>
        </thead>

        <tbody id="data">
        </tbody>
    </table>

    <script>

        const ele = document.getElementById("data");

        const API_KEY = "7352951a376818270c355ce65f7a8067";

        const lat = -75.25;
        const lon = -50.07;

        const URL =
            `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`;

        async function loadWeather() {

            try {

                const res = await fetch(URL);

                if (!res.ok) {
                    throw new Error("Unable to fetch weather data");
                }

                const data = await res.json();

                console.log("Weather Data:", data);

                const temperature = data.main.temp;
                const weather = data.weather[0].main;
                const icon = data.weather[0].icon;

                ele.innerHTML = `
                    <tr>
                        <td>1</td>

                        <td>
                            ${temperature} °C
                        </td>

                        <td>
                            ${weather}
                        </td>

                        <td>
                            <img 
                                src="https://openweathermap.org/img/wn/${icon}@2x.png"
                                alt="${weather}"
                            >
                        </td>
                    </tr>
                `;

            } catch (err) {

                console.log("ERROR:", err);

                ele.innerHTML = `
                    <tr>
                        <td colspan="4">
                            Network Error
                        </td>
                    </tr>
                `;
            }
        }

        loadWeather();

    </script>

</body>
</html>
```
