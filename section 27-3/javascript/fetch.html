<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY SHOP</title>
    <style>
        table {
            width: 100%;
            margin:auto;
            font-size: 16px;
            color: rgb(0, 0, 0);
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #af1e1e;
            padding: 8px;
        }
        th {
            background-color: #c59f9f;
            text-align: left;
        }</style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>so.no</th>
                <th>Title</th>
                <th>Image</th>
                <th>Price</th>
                <th>Category</th>
            </tr>
        </thead>
        <tbody id="data">

        </tbody>
    </table>
    <script>
        const ele=document.getElementById("data");
        const url = "https://dummyjson.com/products";
        async function loadProduct(){
            try{ 
                const response = await fetch(url);
                const data = await response.json();
                console.log("Data:", data, data.products);
                let row = "";
                data.products.map((i,index)=>{
                    row += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${i.title}</td>
                        <td><img src=${i.images[0]} alt = ${i.title} width="100"/></td>
                        <td>${i.price}</td>
                        <td>${i.category}</td>
                    </tr>
                    `;
                })
                ele.innerHTML = row;
            }
            catch(error){
                console.log("Error:", error);
                ele.innerHTML = `<tr><td colspan="5">Network Error</td></tr>`;
            }
        }
        loadProduct();
    </script>
</body>
</html>
